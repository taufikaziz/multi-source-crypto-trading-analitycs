name: crypto_platform
version: 1.0.0
config-version: 2

profile: crypto_platform

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

require-dbt-version: [">=1.8.0", "<2.0.0"]

# Models configuration
models:
  crypto_platform:
    staging:
      +materialized: view
      +schema: staging
      +enabled: true
    intermediate:
      +materialized: view
      +schema: intermediate
      +enabled: true
    marts:
      +materialized: table
      +enabled: true
