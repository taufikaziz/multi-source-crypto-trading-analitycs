name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, "refactor/*" ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio dbt-core

      - name: Run Test Suite
        env:
          PYTHONPATH: .
          BRONZE_STORAGE_BACKEND: local
        run: |
          pytest -v

      - name: Validate dbt Syntax & Models
        run: |
          cd dbt_crypto_platform
          dbt parse --project-dir . --profiles-dir .
