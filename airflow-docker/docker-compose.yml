# Internal-only network so containers cannot be reached directly from the host
# except through explicitly published ports.
networks:
  airflow-internal:
    driver: bridge
    internal: false

services:

  postgres-app:
    image: postgres:16-alpine
    container_name: indodax-app-postgres

    networks:
      - airflow-internal

    environment:
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_DB: ${POSTGRES_APP_DB}

    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./postgres-app-init:/docker-entrypoint-initdb.d:ro

    ports:
      - "127.0.0.1:5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_APP_USER} -d ${POSTGRES_APP_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: indodax-airflow-postgres

    networks:
      - airflow-internal

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: indodax-mongodb

    networks:
      - airflow-internal

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}

    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

    ports:
      - "127.0.0.1:27017:27017"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --u ${MONGO_INITDB_ROOT_USERNAME} --p ${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --quiet --eval 'db.runCommand({ping:1})'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: indodax-minio

    networks:
      - airflow-internal

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9002:9001"  # Console

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

  airflow-api-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: indodax-airflow

    image: ${AIRFLOW_IMAGE_NAME}

    container_name: indodax-airflow-api

    networks:
      - airflow-internal

    depends_on:
      postgres:
        condition: service_healthy
      postgres-app:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS}
      AIRFLOW__API__BASE_URL: ${AIRFLOW__API__BASE_URL}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW__CORE__EXECUTION_API_SERVER_URL}
      DBT_PROFILES_DIR: /opt/airflow/dbt_crypto_platform

    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./logs:/opt/airflow/logs
      - ../src:/opt/airflow/src:ro
      - ../dbt_crypto_platform:/opt/airflow/dbt_crypto_platform:ro

    ports:
      - "127.0.0.1:8080:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

    command:
      [
        "airflow",
        "api-server",
        "--host",
        "0.0.0.0",
        "--port",
        "8080"
      ]

    restart: unless-stopped

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME}

    container_name: indodax-airflow-scheduler

    networks:
      - airflow-internal

    depends_on:
      postgres:
        condition: service_healthy
      postgres-app:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow-api-server:
        condition: service_healthy

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW__CORE__EXECUTION_API_SERVER_URL}
      DBT_PROFILES_DIR: /opt/airflow/dbt_crypto_platform

    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./logs:/opt/airflow/logs
      - ../src:/opt/airflow/src:ro
      - ../dbt_crypto_platform:/opt/airflow/dbt_crypto_platform:ro

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

    command:
      [
        "airflow",
        "scheduler"
      ]

    restart: unless-stopped

  airflow-dag-processor:
    image: ${AIRFLOW_IMAGE_NAME}

    container_name: indodax-airflow-dag-processor

    networks:
      - airflow-internal

    depends_on:
      postgres:
        condition: service_healthy
      postgres-app:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./logs:/opt/airflow/logs
      - ../src:/opt/airflow/src:ro
      - ../dbt_crypto_platform:/opt/airflow/dbt_crypto_platform:ro

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

    command:
      [
        "airflow",
        "dag-processor"
      ]

    restart: unless-stopped

volumes:
  postgres_data:
  postgres_app_data:
  mongo_data:
  minio_data:
